# ESPHome Diesel Heater BLE - Minimal Working Configuration

esphome:
  name: diesel-heater
  on_boot:
    - priority: -100
      then:
        - logger.log: "Diesel heater controller started"

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "Diesel-Heater Fallback"
    password: !secret ap_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable Over-The-Air updates
ota:
  - platform: esphome
    password: !secret ota_password

# Enable logging
logger:
  level: DEBUG
  logs:
    diesel_heater_ble: DEBUG
    ble_client: DEBUG

# External components
external_components:
  - source:
      type: local
      path: ../components
    components: [ diesel_heater_ble ]

# Enable ESP32 BLE tracker
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# BLE Client for the heater
ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"  # Replace with your heater's MAC address
    id: heater_ble_client

# Main heater component
diesel_heater_ble:
  ble_client_id: heater_ble_client
  id: my_heater

# === SWITCHES ===
switch:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    power:
      name: "Heater Power"
      icon: "mdi:power"

# === NUMBERS ===
number:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    
    power_level:
      name: "Power Level"
      icon: "mdi:gauge"
    
    set_temp:
      name: "Target Temperature"
      icon: "mdi:thermometer"

# === BUTTONS ===
button:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    
    request_status:
      name: "Request Status"
      icon: "mdi:refresh"

# WiFi Signal Sensor
sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  
  # Uptime Sensor
  - platform: uptime
    name: "Uptime"

# Binary sensor for connection status
binary_sensor:
  - platform: status
    name: "Status"
