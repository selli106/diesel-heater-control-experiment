# ESPHome Diesel Heater BLE - Example Configuration
# Replace values in <brackets> with your actual values

esphome:
  name: diesel-heater
  # Uncomment for specific boards:
  # board: esp32-c3-devkitm-1
  # board: esp32-s3-devkitc-1
  on_boot:
    - priority: -100
      then:
        - logger.log: "Diesel heater controller started"

esp32:
  board: esp32dev
  framework:
    type: arduino

# WiFi Configuration
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  
  # Enable fallback hotspot in case wifi connection fails
  ap:
    ssid: "Diesel-Heater Fallback"
    password: !secret ap_password

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable Over-The-Air updates
ota:
  - platform: esphome
    password: !secret ota_password

# Enable logging
logger:
  level: DEBUG  # Change to INFO for production
  logs:
    diesel_heater_ble: DEBUG
    ble_client: DEBUG

# Enable web server (optional)
web_server:
  port: 80

# External components
external_components:
  - source:
      type: local
      path: ../components
    components: [ diesel_heater_ble ]
  # Alternative: use from GitHub
  # - source:
  #     type: git
  #     url: https://github.com/<your-repo>/esphome-diesel-heater-ble
  #     ref: main
  #   components: [ diesel_heater_ble ]

# Enable ESP32 BLE tracker
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

# BLE Client for the heater
ble_client:
  - mac_address: "AA:BB:CC:DD:EE:FF"  # Replace with your heater's MAC address
    id: heater_ble_client
    # Optional: auto-reconnect settings
    # on_connect:
    #   then:
    #     - logger.log: "Heater connected!"
    # on_disconnect:
    #   then:
    #     - logger.log: "Heater disconnected!"

# Main heater component
diesel_heater_ble:
  ble_client_id: heater_ble_client
  id: my_heater

# === SENSORS ===
sensor:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    
    # Power and Status
    running_state:
      name: "Heater Running State"
      icon: "mdi:state-machine"
    
    error_code:
      name: "Heater Error Code"
      icon: "mdi:alert-circle"
    
    running_step:
      name: "Heater Running Step"
      icon: "mdi:stairs"
    
    # Environmental
    altitude:
      name: "Altitude"
      unit_of_measurement: "m"
      icon: "mdi:altimeter"
    
    # Mode and Settings
    running_mode:
      name: "Running Mode"
      icon: "mdi:cog"
    
    set_level:
      name: "Set Power Level"
      icon: "mdi:gauge"
    
    set_temp:
      name: "Set Temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      icon: "mdi:thermometer"
    
    # Electrical
    supply_voltage:
      name: "Supply Voltage"
      unit_of_measurement: "V"
      device_class: voltage
      accuracy_decimals: 1
      icon: "mdi:flash"
    
    # Temperatures
    case_temp:
      name: "Case Temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      icon: "mdi:thermometer-high"
    
    cab_temp:
      name: "Room Temperature"
      unit_of_measurement: "°C"
      device_class: temperature
      icon: "mdi:home-thermometer"
    
    # Time Statistics
    start_time:
      name: "Start Time"
      unit_of_measurement: "s"
      icon: "mdi:timer"
    
    auto_time:
      name: "Auto Time"
      unit_of_measurement: "s"
      icon: "mdi:timer-outline"
    
    run_time:
      name: "Run Time"
      unit_of_measurement: "s"
      icon: "mdi:timer-sand"
    
    # Configuration Sensors
    is_auto:
      name: "Is Auto Mode"
      icon: "mdi:auto-mode"
    
    language:
      name: "Language"
      icon: "mdi:translate"
    
    temp_offset:
      name: "Temperature Offset"
      unit_of_measurement: "°C"
      icon: "mdi:thermometer-lines"
    
    tank_volume:
      name: "Tank Volume"
      unit_of_measurement: "L"
      icon: "mdi:fuel"
    
    oil_pump_type:
      name: "Oil Pump Type"
      icon: "mdi:pump"
    
    rf433_on_off:
      name: "RF433 Status"
      icon: "mdi:remote"
    
    temp_unit:
      name: "Temperature Unit"
      icon: "mdi:temperature-celsius"
    
    altitude_unit:
      name: "Altitude Unit"
      icon: "mdi:ruler"
    
    automatic_heating:
      name: "Automatic Heating"
      icon: "mdi:heating-coil"

  # WiFi Signal Sensor
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s

  # Uptime Sensor
  - platform: uptime
    name: "Uptime"

# === BINARY SENSORS ===
binary_sensor:
  # Connection Status
  - platform: status
    name: "Status"

# === SWITCHES ===
switch:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    power:
      name: "Heater Power"
      icon: "mdi:power"
      # Optional: restore state after reboot
      # restore_mode: RESTORE_DEFAULT_OFF

# === NUMBERS ===
number:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    
    power_level:
      name: "Power Level"
      icon: "mdi:gauge"
      min_value: 1
      max_value: 10
      step: 1
      mode: slider  # or "box"
    
    set_temp:
      name: "Target Temperature"
      icon: "mdi:thermometer"
      unit_of_measurement: "°C"
      min_value: 8
      max_value: 36
      step: 1
      mode: slider  # or "box"

# === BUTTONS ===
button:
  - platform: diesel_heater_ble
    diesel_heater_ble: my_heater
    
    level_up:
      name: "Level Up"
      icon: "mdi:arrow-up-bold"
    
    level_down:
      name: "Level Down"
      icon: "mdi:arrow-down-bold"
    
    temp_up:
      name: "Temperature Up"
      icon: "mdi:thermometer-plus"
    
    temp_down:
      name: "Temperature Down"
      icon: "mdi:thermometer-minus"
  
  # Restart ESP32
  - platform: restart
    name: "Restart"

# === TEXT SENSORS ===
text_sensor:
  # Heater Status as Text
  - platform: template
    name: "Heater Status Text"
    icon: "mdi:information"
    lambda: |-
      int state = id(my_heater).get_state().runningstate;
      switch(state) {
        case 0: return {"Warmup"};
        case 1: return {"Self Test"};
        case 2: return {"Ignition"};
        case 3: return {"Heating"};
        case 4: return {"Shutting Down"};
        default: return {"Unknown"};
      }
    update_interval: 1s
  
  # Error Description
  - platform: template
    name: "Error Description"
    icon: "mdi:alert"
    lambda: |-
      int error = id(my_heater).get_state().errcode;
      switch(error) {
        case 0: return {"No Error"};
        case 1: return {"Undervoltage"};
        case 2: return {"Overvoltage"};
        case 3: return {"Ignition Coil Failure"};
        case 4: return {"Fuel Pump Failure"};
        case 5: return {"High Temperature"};
        case 6: return {"Fan Failure"};
        case 7: return {"Cable Damage"};
        case 8: return {"Combustion Failure"};
        case 9: return {"Sensor Failure"};
        case 10: return {"Ignition Failure"};
        default: return {"Unknown Error"};
      }
    update_interval: 1s

  # WiFi Info
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

# === OPTIONAL: CLIMATE ENTITY ===
# Uncomment to create a climate entity for easier temperature control
# climate:
#   - platform: diesel_heater_ble
#     diesel_heater_ble: my_heater
#     name: "Heater Climate"
#     visual:
#       min_temperature: 8
#       max_temperature: 36
#       temperature_step: 1

# === ADVANCED FEATURES ===

# Interval Components for Custom Actions
interval:
  # Auto-save statistics every hour
  - interval: 1h
    then:
      - logger.log:
          format: "Heater runtime: %.0f seconds"
          args: [ 'id(my_heater).get_state().runtime' ]

# Time-based Automation Example
# time:
#   - platform: homeassistant
#     id: homeassistant_time
#     on_time:
#       # Turn on at 6:00 AM
#       - seconds: 0
#         minutes: 0
#         hours: 6
#         then:
#           - switch.turn_on: heater_power
#           - number.set:
#               id: target_temperature
#               value: 20
#       # Turn off at 10:00 PM
#       - seconds: 0
#         minutes: 0
#         hours: 22
#         then:
#           - switch.turn_off: heater_power

# Custom Scripts
script:
  # Quick start script
  - id: quick_start
    then:
      - switch.turn_on: heater_power
      - delay: 1s
      - number.set:
          id: target_temperature
          value: 22
      - logger.log: "Quick start activated - Target 22°C"
  
  # Emergency stop script
  - id: emergency_stop
    then:
      - switch.turn_off: heater_power
      - logger.log: "Emergency stop activated!"

# === DIAGNOSTICS ===
debug:
  update_interval: 5min
