name: CI

on:
  push:
  pull_request:

jobs:
  markdown-and-links:
    name: Lint Markdown and Check Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
          config: .markdownlint.json

      - name: Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --config .lychee.toml
            --verbose
            --no-progress
            **/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  esphome-validate:
    name: Validate ESPHome Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install esphome

      - name: Create secrets file for validation
        run: |
          cat > examples/secrets.yaml << 'EOF'
          wifi_ssid: "TestSSID"
          wifi_password: "TestPassword"
          ap_password: "TestAPPassword"
          api_encryption_key: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          ota_password: "TestOTAPassword"
          EOF
      
      - name: Validate minimal-config.yaml
        run: |
          cd examples
          esphome config minimal-config.yaml
